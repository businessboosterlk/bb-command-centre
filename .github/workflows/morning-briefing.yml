name: BB Morning Briefing (8am)

on:
  schedule:
    - cron: '30 2 * * 1-6'   # 8:00 AM Sri Lanka (UTC+5:30) Mon-Sat
  workflow_dispatch:

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Send morning briefing
        env:
          SB_URL: https://yyviiwnqgphyklcoijyd.supabase.co/rest/v1
          SB_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5dmlpd25xZ3BoeWtsY29panlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3MjE5OTEsImV4cCI6MjA5MTI5Nzk5MX0.I8YiBr-rfLVcc6DE8Z1PxEP2oxXCelv6mxqAY_wY7lc
          ALERT_URL: https://yyviiwnqgphyklcoijyd.supabase.co/functions/v1/bb-alert
        run: |
          python3 << 'PYEOF'
          import urllib.request, json, os, datetime

          SB    = os.environ['SB_URL']
          KEY   = os.environ['SB_KEY']
          ALERT = os.environ['ALERT_URL']
          HDR   = {"apikey": KEY, "Authorization": f"Bearer {KEY}"}

          def get(path):
              req = urllib.request.Request(f"{SB}/{path}", headers=HDR)
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          today     = datetime.date.today()
          today_str = today.isoformat()
          cutoff    = (today - datetime.timedelta(days=5)).isoformat()

          tasks     = get("tasks?done=eq.false&select=id,title,assign,due")
          overdue   = [t for t in tasks if t.get('due') and t['due'] < today_str]

          invoices  = get("invoices?status=in.(unpaid,overdue)&select=client_name,amount,status")
          total     = sum(i.get('amount', 0) for i in invoices)

          red       = get("clients?health=eq.red&select=name")
          red_names = ', '.join(c['name'] for c in red) if red else 'None'

          coo_chk   = get("video_projects?current_stage=eq.coo_check&is_archived=eq.false&select=title")

          leads     = get("pipeline?status=eq.potential&select=name,created_at")
          stale     = [l['name'] for l in leads if l.get('created_at','') < cutoff + 'T00:00:00']

          day_name  = today.strftime('%A, %d %b')
          lines = [
              f"☀️ Good morning Thulaib — {day_name}",
              "",
              "Here's what needs your attention today:",
              "",
              f"📋 Overdue tasks      : {len(overdue)}",
              f"💰 Unpaid invoices    : {len(invoices)} | LKR {total:,}",
              f"🔴 Red health clients : {red_names}",
              f"🎬 Videos at COO check: {len(coo_chk)}",
              f"🎯 Stale leads (5d+)  : {', '.join(stale[:3]) if stale else 'None'}",
          ]

          if overdue[:3]:
              lines.append("\nTop overdue tasks:")
              for t in overdue[:3]:
                  lines.append(f"  → {t['title'][:45]} [{t.get('assign','?')}]")

          lines.append("\nLog in to BB Command Centre to action these.")

          msg = "\n".join(lines)
          print(msg)

          payload = json.dumps({"message": msg, "page": "Morning Briefing", "role": "ceo"}).encode()
          req = urllib.request.Request(ALERT, data=payload,
              headers={"Content-Type": "application/json"}, method="POST")
          urllib.request.urlopen(req)
          print("Morning briefing sent.")
          PYEOF
