name: BB Finance Agent (5:30pm)

on:
  schedule:
    - cron: '0 12 * * 1-6'   # 5:30 PM Sri Lanka Mon-Sat
  workflow_dispatch:

jobs:
  finance-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check finance and write to CC only (no Gmail)
        env:
          SB_URL: https://yyviiwnqgphyklcoijyd.supabase.co/rest/v1
          # Use the service-role key when it exists, otherwise fall back to the
          # public anon key. The runbook had this as a strict ordering: add the
          # secret FIRST or these agents break. A fallback removes the ordering
          # entirely, so there is never a window where the secret is half done
          # and a scheduled job is failing at 7am.
          SB_KEY: ${{ secrets.SB_SERVICE_ROLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5dmlpd25xZ3BoeWtsY29panlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3MjE5OTEsImV4cCI6MjA5MTI5Nzk5MX0.I8YiBr-rfLVcc6DE8Z1PxEP2oxXCelv6mxqAY_wY7lc' }}
          # so the job can say WHICH key it used without ever printing it
          SB_KEY_KIND: ${{ secrets.SB_SERVICE_ROLE_KEY && 'service-role' || 'anon' }}
        run: |
          python3 << 'PYEOF'
          import urllib.request, json, os, datetime

          SB  = os.environ['SB_URL']
          KEY = os.environ['SB_KEY']
          HDR = {"apikey": KEY, "Authorization": f"Bearer {KEY}"}

          def get(path):
              req = urllib.request.Request(f"{SB}/{path}", headers=HDR)
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          def write_alert(message, severity="info"):
              payload = json.dumps({
                  "agent": "finance", "system": "cc",
                  "message": message, "severity": severity
              }).encode()
              req = urllib.request.Request(f"{SB}/agent_alerts", data=payload,
                  headers={**HDR, "Content-Type": "application/json", "Prefer": "return=minimal"},
                  method="POST")
              urllib.request.urlopen(req)

          today = datetime.date.today()

          invoices = get("invoices?status=in.(unpaid,overdue)&select=client_name,amount,due_date,status")

          # ZERO IS NOT THE SAME AS CLEAR.
          # Once the Class-M lock lands, an anon key reads invoices and gets an
          # empty list rather than an error. This agent would then post nothing
          # and the silence would read as "no unpaid invoices", which is the
          # most expensive kind of wrong: a money check that fails by going
          # quiet. If we got nothing back while holding the public key, say so
          # loudly and call it UNKNOWN, never clear.
          if not invoices and os.environ.get('SB_KEY_KIND') == 'anon':
              msg = ("FINANCE CHECK COULD NOT READ INVOICES. It is holding the public key, "
                     "so an empty result may mean the table is locked rather than paid up. "
                     "Treat as UNKNOWN. Fix: add the SB_SERVICE_ROLE_KEY secret to this repo.")
              write_alert(msg, "critical")
              print(msg)

          for inv in invoices:
              if inv.get('due_date'):
                  try:
                      due = datetime.date.fromisoformat(str(inv['due_date'])[:10])
                      days_late = (today - due).days
                      if days_late >= 14:
                          msg = f"💸 OVERDUE 14+ DAYS: {inv['client_name']} — LKR {inv['amount']:,} ({days_late}d late)"
                          write_alert(msg, "critical")
                          print(msg)
                  except: pass

          total_unpaid = sum(i.get('amount', 0) for i in invoices)
          if total_unpaid > 0:
              msg = f"💰 Total unpaid: LKR {total_unpaid:,} across {len(invoices)} invoice(s)"
              write_alert(msg, "warning")
              print(msg)

          clients = get("clients?select=name,renewal")
          for c in clients:
              if c.get('renewal'):
                  try:
                      ren = datetime.date.fromisoformat(str(c['renewal'])[:10])
                      days_left = (ren - today).days
                      if 0 <= days_left <= 7:
                          msg = f"🔄 Renewal in {days_left}d: {c['name']}"
                          write_alert(msg, "warning" if days_left > 2 else "critical")
                          print(msg)
                  except: pass

          if total_unpaid == 0:
              print("Finance OK — no issues today.")
          PYEOF
